<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bus Logbook Sign up</title>
  <style>
    :root { color-scheme: light; --bg:#f3f6fb; --card:#fff; --ink:#1f2937; --muted:#5c6678; --accent:#1f7a8c; --line:#dfe7f2; }
    * { box-sizing:border-box; }
    body { margin:0; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background:linear-gradient(180deg, #eef5fb 0%, #f9fafb 100%); color:var(--ink); min-height:100vh; display:grid; place-items:center; }
    .card { width:min(420px, 92vw); background:var(--card); border:1px solid var(--line); border-radius:18px; box-shadow:0 14px 30px rgba(15,23,42,.08); padding:28px 24px; }
    h1 { margin:0 0 8px; font-size:2rem; }
    p { color:var(--muted); margin:0 0 20px; }
    label { display:block; font-size:.92rem; color:var(--muted); margin-bottom:8px; }
    input { width:100%; border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-size:1rem; margin-bottom:16px; }
    button { width:100%; border:none; border-radius:10px; padding:12px 16px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
    .error { background:#fff1f2; border:1px solid #fecdd3; color:#9f1239; padding:10px 12px; border-radius:10px; margin-bottom:12px; display:none; }
    .error.show { display:block; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Bus Logbook</h1>
    <p>Create your organisation's account</p>
    <div id="error" class="error"></div>
    <form id="signupForm">
      <label for="organisationName">Organisation name</label>
      <input id="organisationName" name="organisationName" type="text" required minlength="2" maxlength="120" autocomplete="organization" placeholder="Little Flower School">
      <label for="email">Email (this is your username)</label>
      <input id="email" name="email" type="email" required autocomplete="username" placeholder="you@organisation.org">
      <label for="password">Password (at least 8 characters)</label>
      <input id="password" name="password" type="password" required minlength="8" maxlength="200" autocomplete="new-password">
      <label for="password2">Type the password again</label>
      <input id="password2" name="password2" type="password" required minlength="8" maxlength="200" autocomplete="new-password">
      <div id="codeRow" hidden>
        <label for="code">Signup code</label>
        <input id="code" name="code" type="text" autocomplete="off" placeholder="Given to you by the person who sent this link">
      </div>
      <p style="color:var(--muted);font-size:.9rem;margin:0 0 16px;">New accounts are activated after payment and approval.</p>
      <button type="submit" id="submit">Create account</button>
    </form>
    <p style="margin:16px 0 0;text-align:center;font-size:.95rem;">Already have an account? <a href="/login.html">Log in</a></p>
  </div>
  <script src="/signup.js"></script>
</body>
</html>
